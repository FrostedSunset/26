__include__: [ '../dfine/dfine_hgnetv2_n_custom.yml', '../base/deim.yml' ]
print_freq: 20
output_dir: ./outputs/deim_data1_fdpn_lsab_cp
backbone:
  type: HGNetv2_LSAB
  name: B0
  return_idx: [1, 2, 3]
  use_lab: false
  agg: se
DEIM:
  encoder: CFAM
  cp: ConformalCPHead
  lsab: LSAB
LSAB:
  return_idx: [1, 2, 3]
  stem_dim: 64
  depths: [1, 2, 4, 2]
  att_kernel: [11, 11, 11, 11]
  mlp_ratio: 2.0
  drop_path_rate: 0.1
neck:
  type: TGFISMANeck
  in_channels: [128, 256, 512]
  fdpn_ks: [1, 2, 4, 8]
  norm_layer: nn.BatchNorm2d
  act_layer: nn.GELU
ConformalCPHead:
  hidden_dim: 128
  feat_idx: 1
  num_classes: 5
  alpha: 0.1
  mlp_hidden: 128
CFAM:
  in_channels: [128, 256, 512]
  feat_strides: [8, 16, 32]
  out_strides: [16, 32]
  CFAM_ks: [3, 5, 7, 9]
  hidden_dim: 128
  use_encoder_idx: [2]
  dim_feedforward: 512
  depth_mult: 0.5
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001
epoches: 160
flat_epoch: 78
no_aug_epoch: 12
lr_gamma: 1.0
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 78, 148]
  collate_fn:
    mixup_epochs: [4, 78]
    stop_epoch: 148
    base_size_repeat: 1
